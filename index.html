<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IndiaNextTech Academy | Online courses in Web, Python and AI</title>
    <meta
      name="description"
      content="Affordable online courses in web development, Python, AI and placement prep. Free PDF notes and internships at IndiaNextTech."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Bricolage Grotesque (headings) + Figtree (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Sets dark/light theme before the page paints, so there is no flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            saved === "light" || saved === "dark" ? saved : dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
